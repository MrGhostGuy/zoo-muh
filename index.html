/* ── Audio ── */
var AC=null,BUS=null;
function actx(){if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)();BUS=AC.createGain();BUS.gain.value=0.62;BUS.connect(AC.destination)}catch(e){AC=false}}return AC}
function tone(f0,f1,dur,type,vol,delay){
  var a=actx();if(!a)return;var t=a.currentTime+(delay||0);
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(BUS||a.destination);o.start(t);o.stop(t+dur+0.02);
}
var NOISEBUF=null;
function noise(dur,vol,fType,f0,f1,delay){
  var a=actx();if(!a)return;var t=a.currentTime+(delay||0);
  if(!NOISEBUF){
    var bl=Math.max(1,Math.floor(a.sampleRate));
    NOISEBUF=a.createBuffer(1,bl,a.sampleRate);
    var bd=NOISEBUF.getChannelData(0);
    for(var bi=0;bi<bl;bi++)bd[bi]=Math.random()*2-1;
  }
  var s=a.createBufferSource();s.buffer=NOISEBUF;
  var f=a.createBiquadFilter();f.type=fType||'bandpass';
  f.frequency.setValueAtTime(f0||800,t);
  if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  f.Q.value=1.2;
  var g=a.createGain();g.gain.setValueAtTime(vol||0.1,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(BUS||a.destination);
  s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);
}
function sfx(n,v){
  if(!actx())return;v=v||1;
  if(n==='launch'){tone(520,180,0.07,'sine',0.14*v);tone(780,320,0.05,'sine',0.08*v,0.005);tone(1040,500,0.04,'triangle',0.04*v,0.008);noise(0.015,0.06*v,'highpass',2000,1000);}
  else if(n==='clack'){var pp=280+Math.random()*120;tone(pp,pp*0.6,0.03,'sine',0.10*v);tone(pp*1.8,pp*0.9,0.025,'sine',0.05*v,0.003);noise(0.012,0.04*v,'lowpass',pp*3,pp);}
  else if(n==='pop'){var b=500*(1+((v-1)*0.12));tone(b,b*0.22,0.12,'sine',0.14);tone(b*1.5,b*0.66,0.1,'triangle',0.07,0.01);tone(b*2.2,b*0.5,0.12,'triangle',0.024*v,0.02);noise(0.05,0.05*v,'lowpass',2400,800);}
  else if(n==='swap'){tone(700,500,0.05,'sine',0.07);tone(500,700,0.05,'sine',0.07,0.05);}
  else if(n==='power'){tone(520,520,0.07,'sine',0.09);tone(660,660,0.07,'sine',0.09,0.07);tone(880,880,0.1,'sine',0.1,0.14);}
  else if(n==='bomb'){noise(0.35,0.2,'lowpass',900,120);tone(180,40,0.3,'sawtooth',0.1);}
  else if(n==='lose'){tone(320,80,0.5,'sawtooth',0.09);noise(0.3,0.06,'lowpass',500,100);}
  else if(n==='win'){tone(523,523,0.1,'triangle',0.075);tone(659,659,0.1,'triangle',0.075,0.1);tone(784,784,0.1,'triangle',0.075,0.2);tone(1046,1046,0.22,'triangle',0.09,0.3);}

  else if(n==='insert'){tone(150,80,0.05,'sine',0.07);noise(0.02,0.04,'lowpass',1000,500);tone(3300,2500,0.018,'triangle',0.012);}

  else if(n==='zap'){noise(0.18,0.13*v,'highpass',3200,1200);tone(1500,320,0.16,'triangle',0.05*v);tone(900,190,0.18,'triangle',0.04*v,0.02);}

}

var musicStarted=false,musicOn=true,nextBeat=0,beatN=0,droneGain=null;
function startMusic(){
  var a=actx();if(!a||musicStarted)return;musicStarted=true;
  if(a.state==='suspended'){try{a.resume()}catch(e){}}
  droneGain=a.createGain();droneGain.gain.value=0.0001;droneGain.connect(BUS||a.destination);
  droneGain.gain.setTargetAtTime(musicOn?0.042:0.0001,a.currentTime,2.5);
  var filt=a.createBiquadFilter();filt.type='lowpass';filt.frequency.value=560;filt.Q.value=0.9;filt.connect(droneGain);
  var freqs=[[55,'sine',0.5],[82.5,'sine',0.3],[110,'triangle',0.24]];
  for(var i=0;i<freqs.length;i++){
    var o=a.createOscillator();o.type=freqs[i][1];o.frequency.value=freqs[i][0];
    var g=a.createGain();g.gain.value=freqs[i][2];o.connect(g);g.connect(filt);o.start();}
  var lfo=a.createOscillator();lfo.frequency.value=0.06;var lg=a.createGain();lg.gain.value=70;lfo.connect(lg);lg.connect(filt.frequency);lfo.start();
  nextBeat=a.currentTime+0.25;
}
function chant(vol,dl){
  var a=actx();if(!a)return;
  tone(158,150,0.2,'triangle',0.035*vol,dl);
  noise(0.12,0.018*vol,'bandpass',780,720,dl);
  tone(136,128,0.22,'triangle',0.03*vol,dl+0.17);
  noise(0.14,0.016*vol,'bandpass',690,620,dl+0.17);
}
function beat(){
  var a=actx();if(!a)return;var dl=nextBeat-a.currentTime;if(dl<0)dl=0;
  if(state==='mini')return;
  var b=beatN%4;
  if(b===0){tone(150,72,0.26,'sine',0.07,dl);}
  else if(b===2){tone(196,96,0.2,'sine',0.055,dl);}
  else{tone(120,64,0.17,'sine',0.038,dl+0.1);}
  if(beatN%16===0&&state==='play')chant(0.7,dl+0.02);
  beatN++;nextBeat+=(state==='play'?0.5:0.62);
  if(nextBeat<a.currentTime)nextBeat=a.currentTime+0.5;
}
function musicTick(){if(!musicStarted||!musicOn)return;var a=actx();if(!a)return;var guard=0;while(nextBeat<a.currentTime+0.08&&guard++<8)beat();}
function toggleMusic(){musicOn=!musicOn;var a=actx();if(droneGain&&a)droneGain.gain.setTargetAtTime(musicOn?0.042:0.0001,a.currentTime,0.3);if(musicOn&&a)nextBeat=a.currentTime+0.1;}

/* ── Path builders ── */
function arcPts(cx,cy,r,a0,a1,steps){
  var out=[],n=Math.max(2,Math.ceil(Math.abs(a1-a0)/(Math.PI/2/(steps||12))));
  for(var i=0;i<=n;i++){var a=a0+(a1-a0)*i/n;out.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});}
  return out;
}
function catmull(cps,spc){
  var out=[],n=cps.length;if(n<2)return cps;
  for(var i=0;i<n-1;i++){
    var p0=cps[Math.max(0,i-1)],p1=cps[i],p2=cps[i+1],p3=cps[Math.min(n-1,i+2)];
    for(var j=0;j<spc;j++){
      var t=j/spc,t2=t*t,t3=t2*t;
      out.push({x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
                y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)});
    }
  }
  out.push({x:cps[n-1].x,y:cps[n-1].y});
  return out;
}
function smooth(pts,passes){
  for(var p=0;p<(passes||1);p++){
    for(var i=1;i<pts.length-1;i++){
      pts[i].x=(pts[i-1].x+pts[i].x*2+pts[i+1].x)*0.25;
      pts[i].y=(pts[i-1].y+pts[i].y*2+pts[i+1].y)*0.25;
    }
  }
  return pts;
}
function concat(){var out=[];for(var i=0;i<arguments.length;i++)for(var j=0;j<arguments[i].length;j++)out.push(arguments[i][j]);return out;}

function buildPath(pts){
  var d=0;
  for(var i=0;i<pts.length;i++){
    if(i>0)d+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    pts[i].d=d;
  }
  path=pts;pathLen=d;
}

function pathPos(dist){
  if(!path||!path.length)return{x:W/2,y:H/2};
  if(dist<=0)return{x:path[0].x,y:path[0].y};
  if(dist>=pathLen){var b=path[path.length-1];return{x:b.x,y:b.y}}
  var lo=0,hi=path.length-1;
  while(lo<hi){var mid=(lo+hi)>>1;if(path[mid].d<dist)lo=mid+1;else hi=mid}
  var p2=path[lo],p1=path[lo-1]||p2;
  var seg=p2.d-p1.d||1,t=(dist-p1.d)/seg;
  return{x:p1.x+(p2.x-p1.x)*t,y:p1.y+(p2.y-p1.y)*t};
}
function pathTan(dist){
  var p1=pathPos(dist-2),p2=pathPos(dist+2);
  var dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy)||1;
  return{x:dx/l,y:dy/l};
}
function nearestPathDist(x,y){
  var bd=1e18,best=0;
  for(var i=0;i<path.length-1;i++){
    var a=path[i],b=path[i+1];
    var ex=b.x-a.x,ey=b.y-a.y,len2=ex*ex+ey*ey;
    var t=len2>1e-9?((x-a.x)*ex+(y-a.y)*ey)/len2:0;
    if(t<0)t=0;else if(t>1)t=1;
    var qx=a.x+ex*t,qy=a.y+ey*t,pdx=x-qx,pdy=y-qy,pd=pdx*pdx+pdy*pdy;
    if(pd<bd){bd=pd;best=a.d+(b.d-a.d)*t}
  }
  return best;
}
function computeGuide(){
  guide.length=0;
  if(state!=='play'||!path)return;
  var mx=frogX+Math.cos(aimA)*MZL,my=frogY+Math.sin(aimA)*MZL;
  var maxL=accT>0?280:200,step=5,rad2=196;
  var bpos=[];
  for(var i=0;i<balls.length;i++){if(balls[i].d<-2)continue;bpos.push(pathPos(balls[i].d));}
  var cosA=Math.cos(aimA),sinA=Math.sin(aimA);
  for(var s=0;s<=maxL;s+=step){
    var x=mx+cosA*s,y=my+sinA*s;
    if(x<-6||x>W+6||y<-6||y>H+6){guide.push({x:x,y:y,term:true});break}
    var hit=false;
    for(var b=0;b<bpos.length;b++){var dx=x-bpos[b].x,dy=y-bpos[b].y;if(dx*dx+dy*dy<rad2){hit=true;break}}

}

      ctx.beginPath();ctx.arc(pp.x,pp.y,7.5,0,Math.PI*2);ctx.fill();
      if(band%6===0){ctx.fillStyle='rgba(150,110,255,0.12)';ctx.beginPath();ctx.arc(pp.x,pp.y,5,0,Math.PI*2);ctx.fill()}
    }
    var T=performance.now();
    for(var dd=Math.max(0,d1);dd<=Math.min(pathLen,d2);dd+=12){
      var pp=pathPos(dd),ph=(T/800+dd*0.1)%6.283;
      ctx.globalAlpha=0.15+0.1*Math.sin(ph);
      ctx.fillStyle='#b06fff';
      ctx.beginPath();ctx.arc(pp.x,pp.y,3,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* ── Track pre-render ── */
function renderTrack(){
  if(!trackCv){trackCv=document.createElement('canvas');trackCv.width=W;trackCv.height=H;trackCx=trackCv.getContext('2d')}
  var t=trackCx;
  t.clearRect(0,0,W,H);
  function strokePath(lw,col){
    t.strokeStyle=col;t.lineWidth=lw;t.lineJoin='round';t.lineCap='round';
    t.beginPath();
    for(var i=0;i<path.length;i+=2){if(i===0)t.moveTo(path[i].x,path[i].y);else t.lineTo(path[i].x,path[i].y)}
    t.stroke();
  }
  strokePath(28,'rgba(0,0,0,0.6)');
  strokePath(24,'#3a2e1a');
  var segLen=4;
  for(var d=0;d<pathLen;d+=segLen){
    var p1=pathPos(d),p2=pathPos(Math.min(d+segLen,pathLen));
    var j=(Math.sin(d*0.7)*0.5+0.5)*14-7;
    var r=Math.round(88+j),g=Math.round(72+j*0.8),b=Math.round(48+j*0.5);
    t.strokeStyle='rgb('+r+','+g+','+b+')';t.lineWidth=22;t.lineCap='round';
    t.beginPath();t.moveTo(p1.x,p1.y);t.lineTo(p2.x,p2.y);t.stroke();
  }
  t.globalAlpha=0.3;
  for(var d=0;d<pathLen;d+=segLen){
    var p1=pathPos(d),p2=pathPos(Math.min(d+segLen,pathLen));
    var j=(Math.sin(d*0.7+1)*0.5+0.5)*10-5;
    var r=Math.round(70+j),g=Math.round(56+j*0.8),b=Math.round(38+j*0.5);
    t.strokeStyle='rgb('+r+','+g+','+b+')';t.lineWidth=18;t.lineCap='round';
    t.beginPath();t.moveTo(p1.x,p1.y);t.lineTo(p2.x,p2.y);t.stroke();
  }
  t.globalAlpha=1;
  strokePath(16,'#2a2216');
  strokePath(12,'#3a3224');
  strokePath(8,'rgba(200,170,120,0.04)');
  strokePath(4,'rgba(255,230,180,0.06)');
  for(var sd=8;sd<pathLen;sd+=10){
    var sp=pathPos(sd),sn=pathTan(sd);
    var nx=-sn.y,ny=sn.x;
    t.strokeStyle='rgba(0,0,0,0.35)';t.lineWidth=2.2;t.lineCap='round';
    t.beginPath();t.moveTo(sp.x-nx*10,sp.y-ny*10);t.lineTo(sp.x+nx*10,sp.y+ny*10);t.stroke();
    t.strokeStyle='rgba(140,115,75,0.18)';t.lineWidth=1;
    t.beginPath();t.moveTo(sp.x-nx*10.5,sp.y-ny*10.5);t.lineTo(sp.x+nx*10.5,sp.y+ny*10.5);t.stroke();
  }
  for(var d=0;d<pathLen;d+=4){
    var sp=pathPos(d),sn=pathTan(d);
    var nx=-sn.y,ny=sn.x;
    t.fillStyle='rgba(0,0,0,0.12)';
    t.beginPath();t.arc(sp.x,sp.y,8,0,Math.PI*2);t.fill();
  }
  var railOffset=11.5;
  for(var d=0;d<pathLen;d+=4){
    var sp=pathPos(d),sn=pathTan(d);
    var nx=-sn.y,ny=sn.x;
    var lx1=sp.x-nx*railOffset,ly1=sp.y-ny*railOffset;
    var lx2=sp.x+nx*railOffset,ly2=sp.y+ny*railOffset;
    t.fillStyle='rgba(30,22,14,0.7)';
    t.beginPath();t.arc(lx1,ly1,2.2,0,Math.PI*2);t.fill();
    t.beginPath();t.arc(lx2,ly2,2.2,0,Math.PI*2);t.fill();
    t.fillStyle='rgba(110,88,55,0.3)';
    t.beginPath();t.arc(lx1,ly1,1,0,Math.PI*2);t.fill();
    t.beginPath();t.arc(lx2,ly2,1,0,Math.PI*2);t.fill();
  }
}

/* ── Background ── */
var bgCv=null;
function buildBG(){
  bgCv=document.createElement('canvas');bgCv.width=W;bgCv.height=H;
  var x=bgCv.getContext('2d');
  var g=x.createRadialGradient(W/2,H/2,20,W/2,H/2,200);
  g.addColorStop(0,'#1a1428');g.addColorStop(0.5,'#12101e');g.addColorStop(1,'#0a0812');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalAlpha=0.06;x.fillStyle='#a080ff';
  for(var gx=0;gx<W;gx+=20){for(var gy=0;gy<H;gy+=20){
    if((gx+gy)%40===0){x.fillRect(gx+8,gy+8,2,2)}
    else{x.fillRect(gx+2,gy+14,1,1);x.fillRect(gx+14,gy+4,1,1)}
  }}
  x.globalAlpha=0.08;x.strokeStyle='#a080ff';x.lineWidth=0.5;
  for(var i=0;i<8;i++){x.beginPath();x.arc(W/2,H/2,30+i*22,0,Math.PI*2);x.stroke()}
  x.globalAlpha=0.09;
  var pg=x.createLinearGradient(0,0,8,0);
  pg.addColorStop(0,'#c9a86a');pg.addColorStop(0.5,'#6a5230');pg.addColorStop(1,'#241a10');
  x.fillStyle=pg;x.fillRect(0,8,8,H-16);x.fillRect(W-8,8,8,H-16);
  x.globalAlpha=0.14;x.fillStyle='#d8b878';
  x.fillRect(0,8,11,6);x.fillRect(W-11,8,11,6);
  x.fillRect(0,11,8,2);x.fillRect(W-8,11,8,2);
  x.globalAlpha=0.1;x.fillStyle='#8fe0b0';
  for(var vy=34;vy<H-30;vy+=36){x.fillRect(1,vy,6,3);x.fillRect(W-7,vy+18,6,3)}
  var vg=x.createRadialGradient(W/2,H/2,96,W/2,H/2,192);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.4)');
  x.fillStyle=vg;x.fillRect(0,0,W,H);
  x.globalAlpha=1;
}
function updateMotes(dt){
  for(var i=0;i<motes.length;i++){
    var mo=motes[i];mo.x+=mo.vx*dt;mo.y+=mo.vy*dt;mo.ph+=dt*1.7;
    if(mo.y<-2){mo.y=H+1;mo.x=Math.random()*W}
    if(mo.x<-3)mo.x=W+3;else if(mo.x>W+3)mo.x=-3;
  }
}

/* ── Particle system ── */

function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    if(p.type==='ring'){
      p.life-=dt;
      if(p.life<=0){parts.splice(i,1);continue}
    }else{
      if(p.trail){p.trail.unshift({x:p.x,y:p.y});if(p.trail.length>6)p.trail.pop()}
      p.x+=p.vx;p.y+=p.vy;p.vy+=90*dt;p.life-=dt;
      if(p.life<=0){parts.splice(i,1);continue}
    }
  }
  if(parts.length>400)parts.splice(0,parts.length-400);
  for(var b=bolts.length-1;b>=0;b--){bolts[b].life-=dt;if(bolts[b].life<=0)bolts.splice(b,1);}
}
function updateFloats(dt){
  for(var i=floats.length-1;i>=0;i--){
    var f=floats[i];f.y-=30*dt;f.life-=dt;
    if(f.life<=0)floats.splice(i,1);
  }
}

/* ── Core game logic ── */
function activeColors(){
  var s={};for(var i=0;i<balls.length;i++)s[balls[i].color]=1;
  var arr=[];for(var k in s)arr.push(+k);
  return arr;
}
function pickColor(){
  var act=activeColors(),n=curCn;
  if(act.length>=2&&Math.random()<0.9)return act[(Math.random()*act.length)|0];
  if(act.length===1&&Math.random()<0.5)return act[0];
  return (Math.random()*n)|0;
}
var curCn=4;

function cfg(idx){
  var N=LEVELS.length;
  if(idx<N)return LEVELS[idx];
  var k=idx-N,last=LEVELS[N-1];
  return{colors:Math.min(7,last.colors+Math.floor(k/4)),balls:last.balls+k*12,speed:Math.min(54,last.speed+k*1.1),path:idx%N,frog:LEVELS[idx%N].frog};
}
function waveNum(){var N=LEVELS.length;return lvlIdx>=N?(lvlIdx-N+1):(lvlIdx+1);}

function loadLevel(idx){
  lvlIdx=idx;
  var L=cfg(idx);
  curCn=L.colors;curSpeed=L.speed*CHAINSLOW;totalBalls=L.balls;
  frogX=L.frog.x;frogY=L.frog.y;curPathIdx=L.path;zumaFlag=false;
  buildPath(PATHFNS[L.path]());
  renderTrack();
  balls=[];shots=[];parts=[];floats=[];powerups=[];bolts=[];comboLinks=[];
  spawned=0;spawnT=0.5;slowT=0;revT=0;multT=0;accT=0;combo=0;recoil=0;swapT=0;dangerAmt=0;shake=0;flash=0;heartT=0;
  curC=(Math.random()*L.colors)|0;nextC=(Math.random()*L.colors)|0;
  introT=1.2;state='intro';
  if(idx>=LEVELS.length)endless=true;
  if(idx<LEVELS.length){maxUnlocked=Math.max(maxUnlocked,idx);try{localStorage.setItem('z1max',maxUnlocked)}catch(e){}}
}
function startGame(from){
  score=0;combo=0;
  endless=(mode==='gauntlet');
  lives=(mode==='ironfrog')?1:3;
  try{localStorage.setItem('z1mode',mode)}catch(e){}
  loadLevel(from||0);
  guide.length=0;bolts.length=0;
  hintT=3.2;
  sfx('levelup');startMusic();
}

function spawnBall(){
  if(spawned>=totalBalls)return;
  balls.push({color:pickColor(),d:-2,clackFlash:0});spawned++;
}

function shoot(){
  if(state!=='play'||shootCD>0)return;
  var mx=frogX+Math.cos(aimA)*MZL,my=frogY+Math.sin(aimA)*MZL;
  shots.push({x:mx,y:my,vx:Math.cos(aimA)*SHOTSPD,vy:Math.sin(aimA)*SHOTSPD,color:curC});
  curC=nextC;nextC=pickColor();
  shootCD=SHOOTCD;recoil=1;sfx('launch');
  for(var _sp=0;_sp<3;_sp++){var _sa=aimA+(Math.random()-0.5)*0.75,_sdd=1+Math.random()*1.5;
    parts.push({x:mx,y:my,vx:Math.cos(_sa)*28*_sdd,vy:Math.sin(_sa)*28*_sdd,life:0.12+Math.random()*0.07,max:0.19,col:'#fff',r:1.1+Math.random()*0.7,spark:true});}
}
function swapBalls(){
  if(state!=='play'||swapT>0)return;
  var t=curC;curC=nextC;nextC=t;swapT=0.18;sfx('swap');
}

function checkMatch(idx){
  if(idx<0||idx>=balls.length)return false;
  var c=balls[idx].color,a=idx,b=idx;
  while(a>0&&balls[a-1].color===c&&(balls[a-1].d-balls[a].d)<SP+1)a--;
  while(b<balls.length-1&&balls[b+1].color===c&&(balls[b].d-balls[b+1].d)<SP+1)b++;
  if(b-a+1>=3){popBalls(a,b);return true}
  return false;
}
function popBalls(a,b){
  var n=b-a+1,now=performance.now()/1000;
  combo=(now-lastPopT<1.4)?combo+1:1;lastPopT=now;
  var pts=Math.round(n*50*combo*(multT>0?2:1));score+=pts;
  var midD=balls[Math.floor((a+b)/2)].d,mp=pathPos(midD);
  var linkPts=[];
  for(var i=a;i<=b;i++){
    var bp=pathPos(balls[i].d);
    spawnPop(bp.x,bp.y,balls[i].color,8);
    linkPts.push({x:bp.x,y:bp.y,col:COLORS[balls[i].color].hi});
  }
  if(linkPts.length>=3){
    comboLinks.push({pts:linkPts,life:0.6,max:0.6,col:linkPts[0].col,width:3+combo*0.5});
  }
  floats.push({txt:'+'+pts,life:0.8,max:0.8,x:mp.x,y:mp.y-10,col:'#ffe066',size:9});
  if(combo>=2)floats.push({txt:'COMBO x'+combo,life:1,max:1,x:mp.x,y:mp.y-22,col:'#ff9a5a',size:8});
  if(combo>=4)floats.push({txt:'INCREDIBLE!',life:1.2,max:1.2,x:mp.x,y:mp.y-34,col:'#ff6b6b',size:9});
  if(combo>=2)shake=Math.min(8,shake+combo*0.7);
  flash=Math.min(0.2,0.07*combo);flashCol='#fff';
  sfx('pop',combo);
  if(Math.random()<0.18){
    var r=Math.random(),tp;
    if(r<0.30)tp='bomb';else if(r<0.53)tp='slow';
    else if(r<0.74)tp='lightning';else if(r<0.88)tp='accuracy';else tp='multiplier';
    powerups.push({d:midD,type:tp,pulse:Math.random()*6});
  }
  balls.splice(a,n);
  if(combo>=5&&combo%5===0&&state==='play'){
    var rr=Math.random(),tp2;
    if(rr<0.18)tp2='bomb';else if(rr<0.38)tp2='slow';else if(rr<0.58)tp2='reverse';
    else if(rr<0.75)tp2='lightning';else if(rr<0.87)tp2='accuracy';else tp2='multiplier';
    activatePower({d:midD,type:tp2,pulse:0});
    if(state==='play')floats.push({txt:'5 STREAK!',life:1.3,max:1.3,x:mp.x,y:mp.y-34,col:'#c99aff',size:9});
  }
  if(!balls.length&&spawned>=totalBalls){if(state==='play')levelClear();return true}
  return false;
}

function removeIndices(idx){
  idx.sort(function(a,b){return a-b});
  for(var i=idx.length-1;i>=0;i--)balls.splice(idx[i],1);
}
function activatePower(pw){
  var pp=pathPos(Math.max(0,Math.min(pathLen,pw.d)));
  sfx('power');flash=0.2;flashCol='#9cf';shake=Math.min(8,shake+2);
  var now=performance.now()/1000;
  if(pw.type==='bomb'||pw.type==='lightning'){
    var killed=[];
    if(pw.type==='bomb'){
      sfx('bomb');shake=7;flash=0.3;flashCol='#ff9a00';
      for(var i=0;i<balls.length;i++)if(Math.abs(balls[i].d-pw.d)<46)killed.push(i);
    }else{
      sfx('zap');flash=0.3;flashCol='#bfe8ff';shake=6;
      var ni=-1,nd=1e9;
      for(var q=0;q<balls.length;q++){var ad=Math.abs(balls[q].d-pw.d);if(ad<nd){nd=ad;ni=q}}
      if(ni>=0){
        var col=balls[ni].color;
        for(var j=0;j<balls.length;j++)if(balls[j].color===col&&Math.abs(balls[j].d-pw.d)<150)killed.push(j);
        var bp2=pathPos(balls[ni].d);
        bolts.push({pts:[{x:pp.x,y:-10},{x:bp2.x+(Math.random()-0.5)*40,y:bp2.y-46},{x:bp2.x+(Math.random()-0.5)*18,y:bp2.y-20},bp2],life:0.35,max:0.35});
      }
    }
    if(killed.length){
      combo=(now-lastPopT<1.4)?combo+1:1;lastPopT=now;
      var pts=Math.round(killed.length*(pw.type==='lightning'?80:100)*combo*(multT>0?2:1));score+=pts;
      for(var k=0;k<killed.length;k++){var kp=pathPos(balls[killed[k]].d);spawnPop(kp.x,kp.y,balls[killed[k]].color,6);}
      floats.push({txt:(pw.type==='lightning'?'ZAP! +':'BOOM! +')+pts,life:1,max:1,x:pp.x,y:pp.y-10,col:pw.type==='lightning'?'#9fe0ff':'#ff9a5a',size:9});
      removeIndices(killed);
      if(!balls.length&&spawned>=totalBalls){levelClear();return}
    }
  }else if(pw.type==='slow'){
    slowT=5;floats.push({txt:'SLOW TIME!',life:1,max:1,x:pp.x,y:pp.y-10,col:'#5ec8ff',size:9});
  }else if(pw.type==='reverse'){
    revT=2.5;floats.push({txt:'REVERSE!',life:1,max:1,x:pp.x,y:pp.y-10,col:'#c99aff',size:9});
  }else if(pw.type==='accuracy'){
    accT=6;floats.push({txt:'ACCURACY!',life:1,max:1,x:pp.x,y:pp.y-10,col:'#9ef',size:9});sfx('lock');
  }else if(pw.type==='multiplier'){
    multT=8;floats.push({txt:'SCORE x2!',life:1,max:1,x:pp.x,y:pp.y-10,col:'#ffd54a',size:9});sfx('mult');
  }
}

function levelClear(){
  var bonus=500+lvlIdx*100+lives*150;
  score+=bonus;sfx('win');flash=0.3;flashCol='#ffe066';
  floats.push({txt:endless?'WAVE CLEAR!':'LEVEL CLEAR!',life:1.5,max:1.5,x:W/2,y:H/2-20,col:'#ffe066',size:12});
  floats.push({txt:'+'+bonus,life:1.5,max:1.5,x:W/2,y:H/2-6,col:'#fff',size:9});
  clearT=1.5;state='clear';
}
function startDying(){
  if(state!=='play')return;
  state='dying';dieT=0.9;lives--;sfx('lose');
  shake=8;flash=0.35;flashCol='#f44';
}
function gameOver(){
  if(score>best){best=score;try{localStorage.setItem('z1best',best)}catch(e){}}
  state='over';
}

function insertShot(sh){
  var sd=nearestPathDist(sh.x,sh.y);
  var idx=0;
  while(idx<balls.length&&balls[idx].d>sd)idx++;
  if(idx>0)sd=Math.min(sd,balls[idx-1].d-SP);
  if(idx<balls.length)sd=Math.max(sd,balls[idx].d);
  sd=Math.max(sd,-5);
  for(var i=balls.length-1;i>=idx;i--)balls[i].d-=SP;
  balls.splice(idx,0,{color:sh.color,d:sd});
  var ip=pathPos(sd);
  spawnInsert(ip.x,ip.y);
  sfx('insert');
  checkMatch(idx);
}

function update(dt){
  if(hintT>0)hintT-=dt;
  updateConfetti(dt);
  if(easterArmed){easterT2-=dt;if(easterT2<=0){easterArmed=false;startMini();}}
  if(state==='mini'){miniUpdate(dt);return}
  if(state==='intro'){introT-=dt;if(introT<=0)state='play';return}
  if(state==='clear'){
    clearT-=dt;updateParts(dt);updateFloats(dt);
    if(clearT<=0){
      var next=lvlIdx+1;
      if(!endless&&next>=LEVELS.length){state='win';return}
      loadLevel(next);sfx('levelup');
    }
    return;
  }
  if(state==='dying'){
    dieT-=dt;updateParts(dt);updateFloats(dt);
    for(var i=0;i<balls.length;i++){
      balls[i].d+=(pathLen+30-balls[i].d)*5*dt+60*dt;
    }
    shake=Math.max(0,shake-dt*20);flash=Math.max(0,flash-dt*3);
    if(dieT<=0){
      if(lives<=0)gameOver();
      else loadLevel(lvlIdx);
    }
    return;
  }
  if(state!=='play')return;
  shake=Math.max(0,shake-dt*26);flash=Math.max(0,flash-dt*4);
  recoil=Math.max(0,recoil-dt*8);shootCD=Math.max(0,shootCD-dt);
  if(swapT>0)swapT-=dt;
  slowT=Math.max(0,slowT-dt);revT=Math.max(0,revT-dt);
  multT=Math.max(0,multT-dt);accT=Math.max(0,accT-dt);
  for(var cf=0;cf<balls.length;cf++)if(balls[cf].clackFlash)balls[cf].clackFlash=Math.max(0,balls[cf].clackFlash-dt);
  for(var cl=comboLinks.length-1;cl>=0;cl--){comboLinks[cl].life-=dt;if(comboLinks[cl].life<=0)comboLinks.splice(cl,1);}
  if(accT>0&&balls.length){
    var bestA=null,bd=1e9;
    for(var ai=0;ai<balls.length;ai++){
      if(balls[ai].color!==curC)continue;
      var ap=pathPos(balls[ai].d),adx=ap.x-frogX,ady=ap.y-frogY;
      var diff=wrapPi(Math.atan2(ady,adx)-aimA);
      if(Math.abs(diff)<0.6&&Math.abs(diff)<bd){bd=Math.abs(diff);bestA=diff}
    }
    if(bestA!==null)aimA+=bestA*Math.min(1,dt*5);
  }
  updateParts(dt);updateFloats(dt);
  var spd=curSpeed*(slowT>0?0.32:1);
  var dir=revT>0?-1:1;
  spawnT-=dt;
  if(spawned<totalBalls&&spawnT<=0){
    var last=balls[balls.length-1];
    if(!last||last.d>SP-4){spawnBall();spawnT=Math.max(0.22,0.38-lvlIdx*0.012)}
  }
  if(!zumaFlag&&spawned>=totalBalls&&balls.length>0){zumaFlag=true;revT=Math.max(revT,2.4);floats.push({txt:'REVERSED!',life:1.4,max:1.4,x:W/2,y:56,col:'#ffd54a',size:11});sfx('mode');}
  if(dir>0){
    if(balls.length)balls[0].d+=spd*dt;
    for(var i=1;i<balls.length;i++){
      var target=balls[i-1].d-SP,gap=target-balls[i].d;
      if(gap>0.4){
        balls[i].d+=Math.min(gap,spd*CATCH*dt);
        if(target-balls[i].d<=0.4){
          balls[i].d=target;balls[i].clackFlash=0.12;sfx('clack');
          checkMatch(i);if(state!=='play')return;
        }
      }else if(gap<0){balls[i].d=target}
    }
  }else{
    for(var j=0;j<balls.length;j++)balls[j].d-=spd*dt;
    if(balls.length&&balls[0].d<0)balls[0].d=0;
    for(var k=1;k<balls.length;k++){
      var t2=balls[k-1].d-SP;
      if(balls[k].d>t2){balls[k].d=t2;balls[k].clackFlash=0.12;checkMatch(k);if(state!=='play')return}
    }
  }
  if(balls.length&&balls[0].d>=pathLen-4){startDying();return}
  if(balls.length&&balls[0].d>pathLen-130){
    dangerAmt=Math.min(1,dangerAmt+dt*2);
    heartT-=dt;if(heartT<=0){sfx('heart');heartT=0.55}
  }else{dangerAmt=Math.max(0,dangerAmt-dt*3)}
  for(var s=shots.length-1;s>=0;s--){
    var sh=shots[s];sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;
    if(Math.random()<0.3&&parts.length<360)parts.push({x:sh.x,y:sh.y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:0.16,max:0.2,col:'#cfe8ff',r:0.8,spark:true});
    if(sh.x<-12||sh.x>W+12||sh.y<-12||sh.y>H+12){shots.splice(s,1);continue}
    var consumed=false;
    for(var w=0;w<powerups.length;w++){
      var pw=powerups[w],pp=pathPos(Math.max(0,pw.d));
      var pdx=sh.x-pp.x,pdy=sh.y-pp.y;
      if(pdx*pdx+pdy*pdy<144){var pk=pp;activatePower(pw);spawnPowerupPickup(pk.x,pk.y,pw.type);powerups.splice(w,1);shots.splice(s,1);consumed=true;break}
    }
    if(consumed){if(state!=='play')return;continue}
    for(var bi=0;bi<balls.length;bi++){
      if(balls[bi].d<-2)continue;
      var bp=pathPos(balls[bi].d);
      var bdx=sh.x-bp.x,bdy=sh.y-bp.y;
      if(bdx*bdx+bdy*bdy<182){insertShot(sh);shots.splice(s,1);consumed=true;break}
    }
    if(state!=='play')return;
  }
}

/* ── Drawing ── */
function draw(){
  computeGuide();
  var sx=shake>0?(Math.random()-0.5)*shake:0;
  var sy=shake>0?(Math.random()-0.5)*shake:0;
  ctx.save();ctx.translate(sx,sy);
  if(bgCv)ctx.drawImage(bgCv,0,0);
  for(var mi=0;mi<motes.length;mi++){
    var mo=motes[mi],ma=mo.al*(0.55+0.45*Math.sin(mo.ph));
    ctx.globalAlpha=Math.max(0,ma);
    ctx.fillStyle='#b9a8ff';
    ctx.beginPath();ctx.arc(mo.x,mo.y,mo.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  var lt=performance.now();
  var lg=ctx.createRadialGradient(W/2+Math.cos(lt/2600)*50,150+Math.sin(lt/3100)*36,8,W/2,150,132);
  var la=0.05+0.03*(0.5+0.5*Math.sin(lt/1300));
  lg.addColorStop(0,'rgba(255,214,150,'+la+')');lg.addColorStop(1,'rgba(255,214,150,0)');
  ctx.fillStyle=lg;ctx.fillRect(-10,-10,W+20,H+20);
  if(trackCv)ctx.drawImage(trackCv,0,0);
  drawPortal();
  if(path&&state!=='title')drawVortex();
  for(var w=0;w<powerups.length;w++){
    var pw=powerups[w],pp=pathPos(Math.max(0,pw.d));
    pw.pulse+=0.06;
    var pc=1+Math.sin(pw.pulse)*0.12;
    var T=performance.now();
    ctx.save();ctx.shadowBlur=10;
    var baseR=8*pc;
    if(pw.type==='bomb'){
      ctx.shadowColor='#f80';ctx.fillStyle='#1a0e00';ctx.beginPath();ctx.arc(pp.x,pp.y,baseR,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ff9a00';ctx.lineWidth=1.5;ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<4;i++){
        var a=T/500+i*1.57;
        ctx.fillStyle='rgba(255,154,0,'+(0.4+0.3*Math.sin(T/300+i))+')';
        ctx.beginPath();ctx.arc(pp.x+Math.cos(a)*baseR*0.6,pp.y+Math.sin(a)*baseR*0.6,2.5,0,Math.PI*2);ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#ff9a00';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('B',pp.x,pp.y+3);
    }else if(pw.type==='slow'){
      ctx.shadowColor='#5ec8ff';ctx.fillStyle='#0a1a2a';ctx.beginPath();ctx.arc(pp.x,pp.y,baseR,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#5ec8ff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<3;i++){
        var a=T/700+i*2.09;
        ctx.fillStyle='rgba(94,200,255,'+(0.35+0.25*Math.sin(T/400+i))+')';
        ctx.beginPath();ctx.arc(pp.x+Math.cos(a)*baseR*0.7,pp.y+Math.sin(a)*baseR*0.7,2,0,Math.PI*2);ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#5ec8ff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('S',pp.x,pp.y+3);
    }else if(pw.type==='reverse'){
      ctx.shadowColor='#c99aff';ctx.fillStyle='#1a0a2a';ctx.beginPath();ctx.arc(pp.x,pp.y,baseR,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#c99aff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<3;i++){
        var a=T/600+i*2.09;
        ctx.fillStyle='rgba(201,154,255,'+(0.4+0.3*Math.sin(T/350+i))+')';
        ctx.beginPath();ctx.arc(pp.x+Math.cos(a)*baseR*0.65,pp.y+Math.sin(a)*baseR*0.65,2.2,0,Math.PI*2);ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#c99aff';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText('R',pp.x,pp.y+3);
    }else if(pw.type==='lightning'){
      ctx.shadowColor='#8fd8ff';ctx.fillStyle='#04121f';ctx.beginPath();ctx.arc(pp.x,pp.y,baseR,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#8fd8ff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.strokeStyle='#dff';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(pp.x-2,pp.y-5);ctx.lineTo(pp.x+1.5,pp.y-1);ctx.lineTo(pp.x-1.5,pp.y-1);ctx.lineTo(pp.x+2,pp.y+5);ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<4;i++){
        var a=T/400+i*1.57;
        ctx.strokeStyle='rgba(143,216,255,'+(0.5+0.3*Math.sin(T/250+i))+')';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(pp.x,pp.y);ctx.lineTo(pp.x+Math.cos(a)*baseR*1.3,pp.y+Math.sin(a)*baseR*1.3);ctx.stroke();
      }
      ctx.globalCompositeOperation='source-over';
    }else if(pw.type==='accuracy'){
      ctx.shadowColor='#9ef';ctx.fillStyle='#0a1a1a';ctx.beginPath();ctx.arc(pp.x,pp.y,baseR,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#9ef';ctx.lineWidth=1.5;ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<4;i++){
        var a=T/550+i*1.57;
        ctx.fillStyle='rgba(153,255,255,'+(0.3+0.25*Math.sin(T/300+i))+')';
        ctx.beginPath();ctx.arc(pp.x+Math.cos(a)*baseR*0.7,pp.y+Math.sin(a)*baseR*0.7,2.5,0,Math.PI*2);ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#dff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('A',pp.x,pp.y+3);
    }else{
      ctx.shadowColor='#ffd54a';ctx.fillStyle='#1a1400';ctx.beginPath();ctx.arc(pp.x,pp.y,baseR,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ffd54a';ctx.lineWidth=1.5;ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      for(var i=0;i<4;i++){
        var a=T/450+i*1.57;
        ctx.fillStyle='rgba(255,213,74,'+(0.4+0.3*Math.sin(T/280+i))+')';
        ctx.beginPath();ctx.arc(pp.x+Math.cos(a)*baseR*0.6,pp.y+Math.sin(a)*baseR*0.6,2.5,0,Math.PI*2);ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#ffd54a';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText('x2',pp.x,pp.y+3);
    }
    ctx.restore();
  }
  drawGuide();
  for(var b=balls.length-1;b>=0;b--){
    if(balls[b].d<-1)continue;
    var bp=pathPos(balls[b].d);
    var bs=balls[b].d<10?0.55+0.045*balls[b].d:1;
    drawMarble(bp.x,bp.y,balls[b].color,bs,balls[b].d/7);
    if(balls[b].clackFlash){
      var a=balls[b].clackFlash/0.12;
      ctx.globalAlpha=a*0.6;ctx.strokeStyle='#fff';ctx.lineWidth=2+4*(1-a);
      ctx.beginPath();ctx.arc(bp.x,bp.y,BR*bs*(1+0.5*(1-a)),0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  for(var s=0;s<shots.length;s++)drawMarble(shots[s].x,shots[s].y,shots[s].color,1);
  drawCannon();
  drawBolts();
  for(var p=0;p<parts.length;p++){
    var pt=parts[p],al=Math.max(0,pt.life/pt.max);
    if(pt.type==='ring'){
      ctx.globalAlpha=al*0.8;ctx.strokeStyle=pt.col;ctx.lineWidth=2+6*(1-al);
      ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r+18*(1-al),0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=al*0.4;ctx.fillStyle=pt.col;
      ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r+10*(1-al),0,Math.PI*2);ctx.fill();
    }else{
      if(pt.trail&&pt.trail.length>1){
        ctx.globalAlpha=al*0.35;ctx.strokeStyle=pt.col;ctx.lineWidth=pt.r*0.7;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(pt.trail[0].x,pt.trail[0].y);
        for(var ti=1;ti<pt.trail.length;ti++)ctx.lineTo(pt.trail[ti].x,pt.trail[ti].y);
        ctx.stroke();
      }
      ctx.globalAlpha=al;
      if(pt.spark){ctx.fillStyle='#fff';ctx.fillRect(pt.x-pt.r/2,pt.y-pt.r/2,pt.r,pt.r)}
      else{ctx.fillStyle=pt.col;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill()}
    }
  }
  ctx.globalAlpha=1;
  for(var cl=0;cl<comboLinks.length;cl++){
    var lk=comboLinks[cl],a=lk.life/lk.max;
    if(lk.pts.length<2)continue;
    ctx.globalAlpha=a*0.9;ctx.strokeStyle=lk.col;ctx.lineWidth=lk.width*a;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(lk.pts[0].x,lk.pts[0].y);
    for(var pi=1;pi<lk.pts.length;pi++)ctx.lineTo(lk.pts[pi].x,lk.pts[pi].y);
    ctx.stroke();
    ctx.globalAlpha=a*0.5;
    for(var pi=0;pi<lk.pts.length;pi++){
      ctx.beginPath();ctx.arc(lk.pts[pi].x,lk.pts[pi].y,4*a,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  if(state==='play'||state==='intro'){
    var T=performance.now();
    ctx.globalCompositeOperation='lighter';
    for(var d=0;d<pathLen;d+=18){
      var pp=pathPos(d),ph=(T/1200+d*0.05)%6.283;
      var glowR=9+Math.sin(ph)*1.5;
      var g=ctx.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,glowR);
      g.addColorStop(0,'rgba(57,255,20,0.18)');g.addColorStop(0.5,'rgba(57,255,20,0.06)');g.addColorStop(1,'rgba(57,255,20,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(pp.x,pp.y,glowR,0,Math.PI*2);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
  drawTunnels();
  if(dangerAmt>0.05){
    var dg=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,180);
    dg.addColorStop(0,'rgba(0,0,0,0)');dg.addColorStop(1,'rgba(200,0,0,'+(dangerAmt*0.25+dangerAmt*0.1*Math.sin(performance.now()/180))+')');
    ctx.fillStyle=dg;ctx.fillRect(-10,-10,W+20,H+20);
    var T=performance.now();
    for(var i=0;i<6;i++){
      var ph=(T/200+i*1.05)%6.283;
      ctx.globalAlpha=dangerAmt*0.15*(0.5+0.5*Math.sin(ph));
      ctx.strokeStyle='#ff4444';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(W/2,H/2,80+i*15,ph,ph+0.8);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  if(slowT>0){
    ctx.fillStyle='rgba(50,100,200,0.08)';ctx.fillRect(-10,-10,W+20,H+20);
    var T=performance.now();
    for(var i=0;i<8;i++){
      var ph=(T/600+i*0.785)%6.283;
      ctx.globalAlpha=0.12+0.08*Math.sin(ph);
      ctx.strokeStyle='#5ec8ff';ctx.lineWidth=0.8;
      ctx.beginPath();ctx.arc(W/2,H/2,40+i*12,ph,ph+1.2);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  if(revT>0){
    ctx.fillStyle='rgba(150,50,200,0.06)';ctx.fillRect(-10,-10,W+20,H+20);
    var T=performance.now();
    for(var i=0;i<6;i++){
      var ph=(T/500+i*1.05)%6.283;
      ctx.globalAlpha=0.15+0.1*Math.sin(ph);
      ctx.strokeStyle='#c99aff';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(W/2,H/2,50+i*14,ph,ph+0.9);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  if(flash>0){ctx.globalAlpha=flash;ctx.fillStyle=flashCol;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=1}
  ctx.restore();
  drawHUD();
  for(var f=0;f<floats.length;f++){
    var fl=floats[f],prog=1-fl.life/fl.max,a=Math.min(1,fl.life/0.4);
    var scale=1+prog*0.4;
    ctx.globalAlpha=a;ctx.fillStyle=fl.col;
    ctx.font='bold '+Math.round(fl.size*scale)+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=2;
    ctx.strokeText(fl.txt,fl.x,fl.y);
    ctx.fillText(fl.txt,fl.x,fl.y);
  }
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
  if(hintT>0&&(state==='play'||state==='intro')){
    var ha=Math.min(1,hintT/0.6);
    ctx.globalAlpha=ha*0.8;ctx.fillStyle='rgba(8,6,14,0.82)';
    ctx.fillRect(24,H-31,W-48,19);
    ctx.strokeStyle='rgba(57,255,20,0.55)';ctx.lineWidth=1;ctx.strokeRect(24,H-31,W-48,19);
    ctx.globalAlpha=ha;ctx.fillStyle='#ffe066';ctx.font='bold 7px monospace';ctx.textAlign='center';
    ctx.fillText('SCROLL: AIM',W/2-42,H-18);
    ctx.fillStyle='#9fe0ff';ctx.fillText('SIDE: SHOOT',W/2+42,H-18);
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='5px monospace';
    ctx.fillText('(tap = swap marble)',W/2,H-38);
    ctx.globalAlpha=1;
  }
  if(state==='intro')drawIntro();
  else if(state==='title')drawTitle();
  else if(state==='over')drawOver();
  else if(state==='win')drawWin();
  else if(state==='clear')drawClear();
  else if(state==='mini')miniDraw();
  for(var _cf=0;_cf<confetti.length;_cf++){
    var cf=confetti[_cf];
    ctx.save();ctx.translate(cf.x,cf.y);ctx.rotate(cf.rot);
    ctx.globalAlpha=Math.max(0,Math.min(1,cf.life/0.5));
    ctx.fillStyle=cf.col;
    ctx.fillRect(-cf.s/2,-cf.s/2,cf.s,cf.s*0.62);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  var g=ctx.createLinearGradient(0,0,0,15);
  g.addColorStop(0,'#2a2018');g.addColorStop(1,'#1a1410');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,15);
  ctx.strokeStyle='#3a3020';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,15);ctx.lineTo(W,15);ctx.stroke();
  ctx.fillStyle='#ffe066';ctx.font='bold 8px monospace';ctx.textAlign='left';
  ctx.fillText(''+score,4,11);
  ctx.textAlign='center';ctx.fillStyle='#9cf';ctx.font='7px monospace';
  ctx.fillText(endless?'∞'+waveNum():''+(lvlIdx+1)+'/'+LEVELS.length,W/2,11);
  ctx.textAlign='right';ctx.fillStyle='#ff6b6b';ctx.font='bold 8px monospace';
  for(var i=0;i<lives;i++){ctx.fillText('♥',W-4-i*9,11)}
  var chips=[];
  if(slowT>0)chips.push({l:'SLOW',t:slowT/5,c:'#5ec8ff'});
  if(revT>0)chips.push({l:'REV',t:revT/2.5,c:'#c99aff'});
  if(multT>0)chips.push({l:'x2',t:multT/8,c:'#ffd54a'});
  if(accT>0)chips.push({l:'ACC',t:accT/6,c:'#9fe0ff'});
  if(chips.length){
    ctx.font='bold 6px monospace';ctx.textAlign='left';
    var cx=4;
    for(var k=0;k<chips.length;k++){
      var lab=chips[k].l,cw=ctx.measureText(lab).width+8;
      ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(cx,17,cw,9);
      ctx.fillStyle=chips[k].c;ctx.fillText(lab,cx+4,24);
      ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(cx,27,cw,2);
      ctx.fillStyle=chips[k].c;ctx.fillRect(cx,27,cw*Math.max(0,Math.min(1,chips[k].t)),2);
      cx+=cw+4;
    }
  }
  var remain=(totalBalls-spawned)+balls.length;
  var frac=totalBalls>0?1-remain/totalBalls:0;
  ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(0,H-5,W,3);
  var pg=ctx.createLinearGradient(0,0,W,0);

var r1AimT=0,lastScrollT=0,lastFireT=0,dbgInput=false,evtLog=[],tapCorner=0,tapCornerT=0;
function logEvt(n){if(!dbgInput)return;evtLog.push(n);if(evtLog.length>4)evtLog.shift()}
function fire(hw){
  if(state!=='play')return false;
  var now=Date.now();
  if(now-lastFireT<130)return false;                    /* debounce: one shot per 130ms */
  if(!hw&&now-lastScrollT<55)return false;              /* a *synthetic* click landing just after a wheel
                                                            gesture is a scroll artifact, not a button press.
                                                            Real inputs (R1 side button, space) pass hw=true
                                                            so scroll-to-aim then side-press always fires. */
  lastFireT=now;logEvt('fire');shoot();return true;
}
function r1Aim(dir){
  lastScrollT=Date.now();logEvt(dir<0?'aimUp':'aimDn');
  if(state==='title'){if(upsideDown)return;startMusic();startGame(mode==='gauntlet'?0:titleSel);return;}
  if(state==='over'){startGame(mode==='gauntlet'?0:titleSel);return;}
  if(state!=='play')return;
  var now=(easterNow||performance.now());

  r1AimT=now;
  aimA+=dir*0.13;
}
function r1Side(){

  easterClick();

  if(state==='title'){startGame(mode==='gauntlet'?0:titleSel);return;}
  if(state==='over'){startGame(mode==='gauntlet'?0:titleSel);return;}
  if(state==='win'){endless=true;loadLevel(LEVELS.length);sfx('levelup');return;}
  if(state==='intro'){introT=0;return;}
  if(state==='play'){logEvt('side');fire(true);}
}

function checkOrientationUpside(){
  upsideDown=false;
  try{var o=window.screen&&screen.orientation;if(o&&o.angle===180)upsideDown=true;}catch(e){}
  if(!upsideDown&&typeof window.orientation==='number'&&Math.abs(window.orientation)===180)upsideDown=true;
  if(!upsideDown)easterSeq=[];
}
window.addEventListener('orientationchange',checkOrientationUpside);
window.addEventListener('deviceorientation',function(e){
  var b=e&&e.beta;
  if(typeof b==='number'&&b>=135&&b<=225){upsideDown=true;return}
  if(typeof b==='number'){upsideDown=false;easterSeq=[]}
});
function easterClick(){
  if(state!=='title'||!upsideDown){easterSeq=[];return}
  try{
    var now=(easterNow||performance.now())/1000;
    if(now-lastEasterClick<0.06)return;
    lastEasterClick=now;
    var gap=now-lastClickT;lastClickT=now;
    if(easterSeq.length&&gap>2.5)easterSeq=[];
    if(easterSeq.length&&gap>0.55)easterSeq.push(1);
    else if(easterSeq.length)easterSeq[easterSeq.length-1]++;
    else easterSeq=[1];
    var ok=true;
    for(var i=0;i<easterSeq.length-1;i++)if(easterSeq[i]!==i+1){ok=false;break}
    if(ok){
      var exp=easterSeq.length,lastG=easterSeq[easterSeq.length-1];
      if(lastG>exp)ok=false;
    }
    if(!ok){easterSeq=[];return}
    if(easterSeq.length===3&&easterSeq[2]===3){easterSeq=[];triggerEasterEgg();}
  }catch(e){easterSeq=[];ERRMSG=((e&&e.message)||String(e))+' @egg';}
}

  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.strokeRect(1,1,W-3,H-3);
}

/* ── Init ── */
try{best=+localStorage.getItem('z1best')||0;maxUnlocked=+localStorage.getItem('z1max')||0;var _sm=localStorage.getItem('z1mode');if(_sm&&modes.indexOf(_sm)>=0)mode=_sm}catch(e){}
for(var _mi=0;_mi<26;_mi++)motes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*2.4,vy:-(0.25+Math.random()*0.9),r:0.5+Math.random()*0.8,ph:Math.random()*6.28,al:0.04+Math.random()*0.1});
buildAllMarbles();buildCannon();buildBG();

/* ── Main loop ── */
var acc=0,FIXED=1/120,ERRMSG='';
window.addEventListener('error',function(ev){if(!ERRMSG)ERRMSG=(ev.message||'error')+' @'+(ev.lineno||0)});
function loop(now){
  try{
    var dt=Math.min(0.05,(now-(loop.last||now))/1000);loop.last=now;
    acc+=dt;
    while(acc>=FIXED){update(FIXED);acc-=FIXED}
    musicTick();
    updateMotes(dt);
    draw();
  }catch(e){if(!ERRMSG)ERRMSG=((e&&e.message)||String(e))+' @loop'}
  if(ERRMSG){
    ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,H-22,W,22);
    ctx.fillStyle='#ff6b6b';ctx.font='6px monospace';ctx.textAlign='left';
    ctx.fillText('ERR '+ERRMSG.slice(0,54),3,H-13);
    ctx.fillText(ERRMSG.slice(54,108),3,H-5);
  }
  requestAnimationFrame(loop);
}
buildPath(PATHFNS[0]());
renderTrack();
requestAnimationFrame(loop);
})();
</script>
</body>
